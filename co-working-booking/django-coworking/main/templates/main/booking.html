{% extends 'main/base.html' %}

{% block title %}Booking{% endblock %}

{% block content %}
<style>
        body {background-image: url(https://www.arteil.com.au/uploads/2022/06/coworking-colour-palette-blog-1.jpg);}
</style>

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4 bg-white">
            <h2 class="text-center" style="color: #404664;">New Booking</h2>
            <br>
            <form action="" method="post" class="text-left">
            {% csrf_token %}
            {{ form.as_p }}
            <br>
            <input type="submit" value="Submit" class="btn" style="background-color: #404664; color: #FFFFFF !important; width: 100%;">
            </form>   
            <br><br>
            <div class="text-left">
                <a href="{% url 'table' %}" class="btn" style="background-color: #8ba6bc; color: #FFFFFF !important;">Bookings Data</a>
            </div>
            <div class="container py-4" style="height: 35vh;"></div>
            <div class="text-sm-end">
                <a href="{% url 'home' %}" class="btn" style="background-color: #8ba6bc; color: #FFFFFF !important;">Go back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
