<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Djastra Co-working{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-image: url(https://img.magnific.com/free-vector/honey-comb-pattern_225004-641.jpg);}
        .card { border: none; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        dialog::backdrop {
    background: rgba(0, 0, 0, 0.5);
}
dialog:modal {
    margin: auto; /* Fixes centering issues if using CSS resets like Tailwind */
    width: 90%;
    max-width: 600px; /* Adjust this value depending on how wide you want it */
    min-height: 300px;
    border: none;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}
[role="tab"][aria-selected="true"] {
  border-bottom: 2px solid ;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1" integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4" style="background-color:#69302c">
        <div class="container">
            <a class="navbar-brand" href="#">Co-working booking</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-light me-3">Welcome, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'mybookings' %}" class="btn btn-outline-light btn-sm">My Bookings</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
<!-- Main Container -->
    <main class="container">
        <!-- Django Flash Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>
    

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
