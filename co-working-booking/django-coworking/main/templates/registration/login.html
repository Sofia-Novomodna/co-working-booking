{% extends 'main/base.html' %}

{% block title %}Login - Djastra{% endblock %}

{% block content %}
<style>
        body {background-image: url(https://www.arteil.com.au/uploads/2022/06/coworking-colour-palette-blog-1.jpg);}
</style>
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 bg-white">
            <h2 class="text-center" style="color: #404664;">Welcome back</h2>
            <br>
            <form action="" method="post" class="text-center">
            {% csrf_token %}
            {{ form.as_p }}
            <br>
            <input type="submit" value="Login" class="btn" style="background-color: #404664; color: #FFFFFF !important; width: 100%;">
            </form>   
            <br>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{% url 'register' %}">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
