{% extends 'main/base.html' %}

{% block title %}Dashboard - Djastra{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <div class="card p-5 bg-white">
            <h1 class="display-5 fw-bold text-dark">Hello, {{ user.username }}! 👋</h1>
            <p class="lead text-muted mt-2">You have successfully logged into your Djastra user dashboard.</p>
            <hr class="my-4">
            <p>Your registered email: <strong>{{ user.email }}</strong></p>
        </div>
    </div>
</div>
{% endblock %}
